<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/styles.css">
<style>
body{width:1200px;height:630px;margin:0;background:#0f172a;color:#f1f5f9;display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:48px;padding:0 72px;box-sizing:border-box;font-family:"IBM Plex Sans Arabic",sans-serif;overflow:hidden}
h1{font-size:64px;line-height:1.15;font-weight:700;margin:0}
p{font-size:26px;color:#cbd5e1;margin:20px 0 0;line-height:1.5}
.top{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;margin-bottom:36px}
.top img{width:52px;height:52px}
.card{background:#111827;border:1px solid #1e293b;border-radius:24px;padding:28px;display:grid;justify-items:center;gap:14px}
.card b{font-size:22px}.card span{font-size:18px;color:#94a3b8}
.ring{width:200px;height:200px}.ring svg{transform:rotate(-90deg) scaleX(-1)}
.ring-track{stroke:#1e293b}.ring-arc{stroke:#60a5fa;stroke-dasharray:62.5 100}
.ring-num bdi{font-size:44px;color:#f1f5f9}
</style></head><body>
<div><div class="top"><img src="/brand/tamnex-mark.svg" alt=""><span>تامنكس · Tamnex</span></div>
<h1>نظام ERP يجهّز إقفالك<br>طوال الشهر</h1>
<p>نظام سعودي من الجيل القادم، قيد البناء. جرّب العرض التفاعلي على tamnex.com</p></div>
<div class="card"><b>جاهزية إقفال أكتوبر</b>
<div class="ring"><svg viewBox="0 0 120 120"><circle class="ring-track" cx="60" cy="60" r="50" fill="none" stroke-width="10"/><circle class="ring-arc" cx="60" cy="60" r="50" pathLength="100" fill="none" stroke-width="10" stroke-linecap="round"/></svg><div class="ring-num"><bdi dir="ltr">5/8</bdi></div></div>
<span>بيانات تجريبية · 3 استثناءات مفتوحة</span></div>
</body></html>
